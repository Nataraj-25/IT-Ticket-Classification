version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: it_ticket_mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - it_ticket_net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: it_ticket_ml_service
    restart: always
    ports:
      - '8000:8000'
    environment:
      - MODEL_DIR=/app/models
    networks:
      - it_ticket_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it_ticket_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=it_ticket_db
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_SERVICE_TIMEOUT_MS=3000
      - CORS_ORIGIN=*
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - it_ticket_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: it_ticket_frontend
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - backend
    networks:
      - it_ticket_net

volumes:
  mongodb_data:

networks:
  it_ticket_net:
    driver: bridge
